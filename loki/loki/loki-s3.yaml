# Loki 3.x, single binary (monolithic), S3 storage, native OTLP ingest at /otlp
# Chunks + TSDB index go to S3. The loki-data volume still holds the WAL, the active
# index (last ~15 min before upload), caches and the compactor working dir.
#
# Credentials: none in this file. Loki uses the AWS default chain, so attach an
# IAM role / instance profile to the VM with s3:ListBucket on the bucket and
# s3:GetObject, s3:PutObject, s3:DeleteObject on bucket/* (delete is needed for retention).
#
# Requires -config.expand-env=true (set in loki/compose.yml) for LOKI_S3_* below.
auth_enabled: false   # fine: Loki is only reachable on the internal docker network

server:
  http_listen_port: 3100
  grpc_listen_port: 9096
  log_level: warn

common:
  instance_addr: 127.0.0.1
  path_prefix: /loki
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory
  storage:
    s3:
      region: ${LOKI_S3_REGION}
      bucketnames: ${LOKI_S3_BUCKET}
      # MinIO / S3-compatible: also set endpoint: <host:port>, s3forcepathstyle: true,
      # insecure: true (if no TLS), access_key_id / secret_access_key

schema_config:
  configs:
    # Fresh install straight to S3. If migrating from the filesystem config instead,
    # KEEP the old filesystem entry and add this one below it with a FUTURE date.
    - from: 2024-04-01
      store: tsdb
      object_store: s3
      schema: v13
      index:
        prefix: index_
        period: 24h

limits_config:
  allow_structured_metadata: true      # required for OTLP attributes / trace_id
  volume_enabled: true
  retention_period: 720h               # 30 days, change as needed
  # protect Loki from one noisy app
  ingestion_rate_mb: 8
  ingestion_burst_size_mb: 16
  per_stream_rate_limit: 5MB
  per_stream_rate_limit_burst: 15MB
  max_line_size: 256KB
  max_line_size_truncate: true
  reject_old_samples: true
  reject_old_samples_max_age: 168h     # 7 days
  max_label_names_per_series: 15
  max_global_streams_per_user: 10000   # guard against label cardinality explosions (and S3 PUT count)

ingester:
  # Fewer, fuller chunks = fewer S3 PUTs. These are the Loki defaults, made explicit.
  chunk_target_size: 1572864           # 1.5 MB compressed
  chunk_idle_period: 30m
  max_chunk_age: 2h

compactor:
  working_directory: /loki/compactor
  retention_enabled: true
  retention_delete_delay: 2h
  delete_request_store: s3

chunk_store_config:
  chunk_cache_config:                  # avoid re-downloading the same chunks (S3 GETs)
    embedded_cache:
      enabled: true
      max_size_mb: 500

query_range:
  results_cache:
    cache:
      embedded_cache:
        enabled: true
        max_size_mb: 100

analytics:
  reporting_enabled: false
