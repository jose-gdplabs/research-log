# Loki 3.x, single binary (monolithic), S3 storage on SeaweedFS (same VM), native OTLP ingest at /otlp
# Chunks + TSDB index go to the SeaweedFS bucket. The loki-data volume still holds the WAL,
# the active index (last ~15 min before upload), caches and the compactor working dir.
#
# Credentials come from loki/.env (LOKI_S3_ACCESS_KEY_ID / LOKI_S3_SECRET_ACCESS_KEY) and must
# match S3_ACCESS_KEY_ID / S3_SECRET_ACCESS_KEY in seaweedfs/.env (the SeaweedFS S3 identity).
#
# Requires -config.expand-env=true (set in loki/compose.yml).
auth_enabled: false   # fine: Loki is only reachable on the internal docker network

server:
  http_listen_port: 3100
  grpc_listen_port: 9096
  log_level: warn

common:
  instance_addr: 127.0.0.1
  path_prefix: /loki
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory
  storage:
    s3:
      endpoint: seaweedfs:8333
      region: us-east-1                # dummy, SeaweedFS ignores it
      bucketnames: ${LOKI_S3_BUCKET}
      access_key_id: ${LOKI_S3_ACCESS_KEY_ID}
      secret_access_key: ${LOKI_S3_SECRET_ACCESS_KEY}
      s3forcepathstyle: true           # http://seaweedfs:8333/<bucket>/..., no virtual-host buckets
      insecure: true                   # plain HTTP, only inside the docker network

schema_config:
  configs:
    - from: 2024-04-01
      store: tsdb
      object_store: s3
      schema: v13
      index:
        prefix: index_
        period: 24h

limits_config:
  allow_structured_metadata: true      # required for OTLP attributes / trace_id
  volume_enabled: true
  retention_period: 720h               # 30 days, change as needed
  # protect Loki from one noisy app
  ingestion_rate_mb: 8
  ingestion_burst_size_mb: 16
  per_stream_rate_limit: 5MB
  per_stream_rate_limit_burst: 15MB
  max_line_size: 256KB
  max_line_size_truncate: true
  reject_old_samples: true
  reject_old_samples_max_age: 168h     # 7 days
  max_label_names_per_series: 15
  max_global_streams_per_user: 10000   # guard against label cardinality explosions

ingester:
  # Loki defaults, made explicit: flush a chunk at 1.5 MB, 30m idle or 2h age, whichever first
  chunk_target_size: 1572864
  chunk_idle_period: 30m
  max_chunk_age: 2h

compactor:
  working_directory: /loki/compactor
  retention_enabled: true
  retention_delete_delay: 2h
  delete_request_store: s3

chunk_store_config:
  chunk_cache_config:                  # avoid re-reading the same chunks from SeaweedFS
    embedded_cache:
      enabled: true
      max_size_mb: 500

query_range:
  results_cache:
    cache:
      embedded_cache:
        enabled: true
        max_size_mb: 100

analytics:
  reporting_enabled: false
