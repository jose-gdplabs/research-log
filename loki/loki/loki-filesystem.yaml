# Loki 3.x, single binary (monolithic), filesystem storage, native OTLP ingest at /otlp
# All data (chunks, index, WAL) lives in the loki-data volume on the VM disk.
auth_enabled: false   # fine: Loki is only reachable on the internal docker network

server:
  http_listen_port: 3100
  grpc_listen_port: 9096
  log_level: warn

common:
  instance_addr: 127.0.0.1
  path_prefix: /loki
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules

schema_config:
  configs:
    - from: 2024-04-01
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

limits_config:
  allow_structured_metadata: true      # required for OTLP attributes / trace_id
  volume_enabled: true
  retention_period: 720h               # 30 days, change as needed
  # protect Loki from one noisy app
  ingestion_rate_mb: 8
  ingestion_burst_size_mb: 16
  per_stream_rate_limit: 5MB
  per_stream_rate_limit_burst: 15MB
  max_line_size: 256KB
  max_line_size_truncate: true
  reject_old_samples: true
  reject_old_samples_max_age: 168h     # 7 days
  max_label_names_per_series: 15
  max_global_streams_per_user: 10000   # guard against label cardinality explosions

compactor:
  working_directory: /loki/compactor
  retention_enabled: true
  retention_delete_delay: 2h
  delete_request_store: filesystem

query_range:
  results_cache:
    cache:
      embedded_cache:
        enabled: true
        max_size_mb: 100

analytics:
  reporting_enabled: false
