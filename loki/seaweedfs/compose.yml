# SeaweedFS single node: S3-compatible storage for Loki on the same VM.

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  seaweedfs:
    image: chrislusf/seaweedfs:3.80
    # master + volume + filer + S3 gateway in one process
    command:
      - server
      - -dir=/data
      - -ip=seaweedfs
      - -ip.bind=0.0.0.0
      - -master.volumeSizeLimitMB=1024
      - -volume.max=0                  # auto: as many volumes as free disk allows
      - -s3
      - -s3.port=8333
      - -s3.config=/etc/seaweedfs/s3.json
    restart: unless-stopped
    volumes:
      - seaweedfs-data:/data
    configs:
      - source: seaweedfs_s3
        target: /etc/seaweedfs/s3.json
    # Not published to the host: only Loki talks to it on the internal network.
    expose:
      - "8333"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:9333/cluster/status && wget -q -O /dev/null http://localhost:8888/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 1g
    logging: *default-logging

  # One-shot: create the bucket if it does not exist yet (safe to re-run).
  seaweedfs-init:
    image: chrislusf/seaweedfs:3.80
    entrypoint: ["sh", "-c"]
    command:
      - |
        set -e
        WS="weed shell -master=seaweedfs:9333 -filer=seaweedfs:8888"
        if echo "s3.bucket.list" | $$WS | grep -qw "${S3_BUCKET:?set S3_BUCKET in seaweedfs/.env}"; then
          echo "bucket ${S3_BUCKET} already exists"
        else
          echo "s3.bucket.create -name ${S3_BUCKET}" | $$WS
          echo "s3.bucket.list" | $$WS | grep -qw "${S3_BUCKET}"
          echo "bucket ${S3_BUCKET} created"
        fi
    restart: "no"
    depends_on:
      seaweedfs:
        condition: service_healthy
    logging: *default-logging

configs:
  # S3 identity for Loki, rendered from .env. Write covers PUT and DELETE (retention needs delete).
  seaweedfs_s3:
    content: |
      {
        "identities": [
          {
            "name": "loki",
            "credentials": [
              {
                "accessKey": "${S3_ACCESS_KEY_ID:?set S3_ACCESS_KEY_ID in seaweedfs/.env}",
                "secretKey": "${S3_SECRET_ACCESS_KEY:?set S3_SECRET_ACCESS_KEY in seaweedfs/.env}"
              }
            ],
            "actions": ["Read", "Write", "List", "Tagging"]
          }
        ]
      }

volumes:
  seaweedfs-data:
